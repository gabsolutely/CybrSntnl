; =========================
; PlatformIO Configuration
; =========================

[platformio]
src_dir = src

; =====================================================
; CORE BUILD
; =====================================================

[env:core]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -std=gnu++17
    -DCS_MODE_CORE
    -DCORE_DEBUG_LEVEL=3
    -Wno-deprecated-declarations
    -I include

lib_deps =
    adafruit/Adafruit GFX Library@1.11.9
    adafruit/Adafruit SSD1306@2.5.7
    bblanchon/ArduinoJson@^7.4.2

board_build.filesystem = spiffs

build_unflags =
    -std=gnu++11


; =====================================================
; INTERNAL BUILD
; =====================================================

[env:internal]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -std=gnu++17
    -DCS_MODE_INTERNAL
    -DENABLE_CLOUD_FEATURES
    -DENABLE_REPLAY_FEATURES
    -DCORE_DEBUG_LEVEL=3
    -I include

lib_deps =
    adafruit/Adafruit GFX Library@1.11.9
    adafruit/Adafruit SSD1306@2.5.7
    bblanchon/ArduinoJson@^7.4.2

board_build.filesystem = spiffs

build_unflags =
    -std=gnu++11
